services:
  app:
    image: localhost/ubi-rebuild-demo:latest
    container_name: demo-rebuild-app
    build:
      context: .
      dockerfile: Containerfile
      args:
        APP_VERSION: "${APP_VERSION:-1.0.0}"
    ports:
      - "8084:3000"
    develop:
      watch:
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./src
